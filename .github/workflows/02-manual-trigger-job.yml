name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:
  push:
    branches: [main, new-branch]
  pull_request:
    branches: [main]

env:
  WORKSPACE_NAME: myWorkspace
  RESOURCE_GROUP_NAME: myResourceGroup

permissions:
  id-token: write
  contents: read

jobs:
  linting:
    name: linting
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Use Python version 3.8
      uses: actions/setup-python@v3
      with:
        python-version: '3.8'
    - name: Install Flake8
      run: |
        python -m pip install flake8
    - name: Run linting tests
      run: | 
        flake8 src/model/

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    needs: [linting]
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Use Python version 3.8
      uses: actions/setup-python@v3
      with:
        python-version: '3.8'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pytest
    - name: Run unit tests
      run: | 
        pytest tests/test_train.py

  train-dev:
    runs-on: ubuntu-latest
    needs: [unit-test]
    environment:
      name: dev
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Submit Azure ML dev job
      run: |
        az ml job create --file src/job.yml --workspace-name ${{ env.WORKSPACE_NAME }} --resource-group ${{ env.RESOURCE_GROUP_NAME }}

  train-prod:
    runs-on: ubuntu-latest
    needs: [train-dev]
    environment:
      name: prod
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Submit Azure ML prod job
      run: |
        az ml job create --file src/job-prod.yml --workspace-name ${{ env.WORKSPACE_NAME }} --resource-group ${{ env.RESOURCE_GROUP_NAME }}


